- id: '1754414363475'
  alias: Uso prolungato condizionatore camera da letto
  description: Quando il condizionatore e' acceso da piu' di 3 ore, avvisa l'utente
  triggers:
  - entity_id:
    - climate.daikin_camera_da_letto
    to:
    for:
      hours: 3
      minutes: 0
      seconds: 0
    trigger: state
    from: 'off'
  conditions:
  - condition: time
    after: 08:00:00
    before: '23:00:00'
  actions:
  - action: notify.send_message
    metadata: {}
    target:
      entity_id: notify.echo_dot_camera_speak
    data:
      message: Il condizionatore e' acceso da piu' di tre ore
  mode: single
