- id: '1754416382928'
  alias: Lavastoviglie fine programma
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.lavastoviglie_operation_state
    from: run
    to: finished
  conditions:
  - condition: time
    after: 08:00:00
    before: '23:50:00'
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  actions:
  - action: notify.send_message
    metadata: {}
    data:
      message: La lavastoviglie ha terminato il programma
    target:
      entity_id: notify.echo_dot_salotto_announce
  mode: single
- id: '1757923183242'
  alias: Periodic speedtest
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 20
      milliseconds: 0
  - action: ookla_speedtest.run_speedtest
    metadata: {}
    data: {}
  mode: single
- id: '1768815910053'
  alias: Bedroom light color
  description: Set WiZ light to 4000K on turn on
  triggers:
  - entity_id:
    - light.luce_alessia
    - light.luce_valerio
    to: 'on'
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ state_attr(trigger.entity_id, ''color_temp_kelvin'') != 4000
      }}

      '
  actions:
  - target:
      entity_id: '{{ trigger.entity_id }}'
    data:
      color_temp_kelvin: 3000
    action: light.turn_on
  mode: single
